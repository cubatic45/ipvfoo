name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: make test
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: ipvfoo-enhanced
          path: |
            build/*.zip
            build/*.xpi
